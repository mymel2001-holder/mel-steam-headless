name: Build and Publish Docker Image to GHCR

on:
  workflow_dispatch:
    branches: [ master ]
  push:
    branches: [ master ] # Trigger on pushes to the main branch
  pull_request:
    branches: [ master ] # Also trigger on pull requests to main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner
    
    permissions:
      contents: read # Needed to checkout the repository
      packages: write # Needed to push the image to GHCR
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3 # Checkout the code

      - name: Log in to the Container registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.0.0
        with:
          context: . # Build context is the root of the repository
          file: ./Dockerfile # Path to the Dockerfile
          push: true # Push the image to the registry
          tags: ${{ steps.meta.outputs.tags }} # Use the tags generated by the metadata action
          labels: ${{ steps.meta.outputs.labels }} # Use the labels generated by the metadata action
